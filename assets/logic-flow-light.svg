<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="740" fill="#ffffff"/>

  <text x="40" y="42" font-size="17" font-weight="700" fill="#1f2328">LIAR'S DICE PREDICTOR</text>
  <text x="278" y="42" font-size="14" fill="#57606a">exact math, cross-checked by simulation</text>

  <!-- ===== left lane: exact pipeline ===== -->
  <rect x="40" y="70" width="410" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="99" font-size="15" font-weight="600" fill="#1f2328">Inputs</text>
  <text x="60" y="122" font-size="13" fill="#57606a">total dice on the table &#183; your hand &#183; the bid &#8220;Q &#215; F&#8221;</text>

  <line x1="245" y1="140" x2="245" y2="176" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="180" width="410" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="209" font-size="15" font-weight="600" fill="#1f2328">Split known vs unknown</text>
  <text x="60" y="232" font-size="13" fill="#57606a">your hand is visible; the other dice are i.i.d. d6 rolls</text>

  <line x1="245" y1="250" x2="245" y2="286" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="290" width="410" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="319" font-size="15" font-weight="600" fill="#1f2328">Count guaranteed matches</text>
  <text x="60" y="342" font-size="13" fill="#57606a">m = your F's + wild 1s &#8594; still need k = Q &#8722; m</text>

  <line x1="245" y1="360" x2="245" y2="396" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="400" width="410" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="429" font-size="15" font-weight="600" fill="#1f2328">Exact binomial tail</text>
  <text x="60" y="452" font-size="13" fill="#57606a">P(X &#8805; k), each unknown die matches with p = 2/6</text>

  <line x1="245" y1="470" x2="245" y2="506" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="510" width="410" height="70" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="60" y="539" font-size="15" font-weight="600" fill="#1f2328">Red-die correction</text>
  <text x="60" y="562" font-size="13" fill="#6e5a10">+ P(X = k &#8722; 1) &#215; 1/6 &#8212; the bidder's last-chance roll</text>

  <line x1="245" y1="580" x2="245" y2="616" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="620" width="410" height="70" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
  <text x="60" y="649" font-size="15" font-weight="600" fill="#1f2328">P(bid stands) &#8594; verdict</text>
  <text x="60" y="672" font-size="13" fill="#1a7f37">bid is safe / CALL LIAR (call when P(false) &gt; 0.5)</text>

  <!-- ===== right lane: simulation cross-check ===== -->
  <text x="510" y="278" font-size="13" font-weight="700" letter-spacing="1" fill="#0969da">SIMULATION CROSS-CHECK</text>

  <rect x="510" y="290" width="370" height="70" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="530" y="319" font-size="15" font-weight="600" fill="#1f2328">Roll every unknown die</text>
  <text x="530" y="342" font-size="13" fill="#0969da">same rules: wild 1s, ties, red die</text>

  <line x1="695" y1="360" x2="695" y2="396" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="400" width="370" height="70" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="530" y="429" font-size="15" font-weight="600" fill="#1f2328">Repeat 50,000 trials</text>
  <text x="530" y="452" font-size="13" fill="#0969da">core.monte_carlo &#8594; hit rate &#177; std error</text>

  <line x1="695" y1="470" x2="695" y2="506" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="510" width="370" height="70" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="530" y="539" font-size="15" font-weight="600" fill="#1f2328">Tests assert agreement</text>
  <text x="530" y="562" font-size="13" fill="#0969da">|exact &#8722; simulated| &lt; 1%  (pytest)</text>

  <!-- cross links -->
  <line x1="450" y1="215" x2="668" y2="286" stroke="#54aeff" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="480" y="230" font-size="12" fill="#0969da">same inputs</text>

  <line x1="450" y1="545" x2="506" y2="545" stroke="#54aeff" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="452" y="536" font-size="12" fill="#0969da">compare</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liars-dice-predictor"
version = "0.1.0"
description = "Liar's Dice odds and move predictions: exact binomial model with a Monte-Carlo cross-check"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=1.26"]

[project.scripts]
liars-dice = "prediction_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
